name: Linux Build Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:

  linux:
    name: Build Custom Telegram Linux
    runs-on: ubuntu-latest

    env:
      UPLOAD_ARTIFACT: "true"
      IMAGE_TAG: tdesktop:centos_env
      ARTIFACT_NAME: "Telegram-Custom-Linux"

    steps:
      - name: Checkout repo.
        uses: actions/checkout@v4

      - name: Clone official Telegram Desktop v7.0.5.
        run: |
          git clone --recursive --branch v7.0.5 https://github.com/telegramdesktop/tdesktop.git tdesktop-src
          cp -r tdesktop-src/* .
          cp -r tdesktop-src/.* . 2>/dev/null || true
          rm -rf tdesktop-src

      - name: Apply Custom Features Patch.
        run: |
          patch -p1 < custom_features.patch

      - name: Set up API keys in config.h.
        run: |
          sed -i 's/#error You are required to provide API_ID and API_HASH./constexpr auto ApiId = 29579556; constexpr auto ApiHash = "351a588e027c04b1b5a1c2b28cbd9cfd";/' Telegram/SourceFiles/config.h

      - name: Free up disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Pull Pre-built Telegram Docker Environment.
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest
          docker tag ghcr.io/telegramdesktop/tdesktop/centos_env:latest ${{ env.IMAGE_TAG }}

      - name: Build Telegram Desktop.
        run: |
          mkdir -p $RUNNER_TEMP/.tdesktop-cache
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v $RUNNER_TEMP/.tdesktop-cache:/var/cache/ccache \
          -e CONFIG=Debug \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
          -D TDESKTOP_API_ID=29579556 \
          -D TDESKTOP_API_HASH=351a588e027c04b1b5a1c2b28cbd9cfd \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Move artifact.
        run: |
          cd out/Debug
          mkdir artifact
          mv Telegram artifact/

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/Debug/artifact/
