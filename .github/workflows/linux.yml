name: Linux Build Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: Build Custom Telegram Linux

    env:
      UPLOAD_ARTIFACT: "true"
      IMAGE_TAG: tdesktop:centos_env
      ARTIFACT_NAME: "Telegram-Custom-Linux"

    steps:
      - name: Checkout repo.
        uses: actions/checkout@v4

      - name: Clone official Telegram Desktop v7.1.3.
        run: |
          git clone --recursive --branch v7.1.3 https://github.com/telegramdesktop/tdesktop.git tdesktop-src
          cp -r tdesktop-src/* .
          cp -r tdesktop-src/.* . 2>/dev/null || true
          rm -rf tdesktop-src

      - name: Apply Custom Features.
        run: |
          python3 apply_features.py

      - name: Set up API keys in config.h.
        run: |
          sed -i 's/#error You are required to provide API_ID and API_HASH./constexpr auto ApiId = 29579556; constexpr auto ApiHash = "351a588e027c04b1b5a1c2b28cbd9cfd";/' Telegram/SourceFiles/config.h

      - name: Free up disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Pull Pre-built Telegram Docker Environment.
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest
          docker tag ghcr.io/telegramdesktop/tdesktop/centos_env:latest tdesktop:centos_env

      - name: Build Telegram Desktop.
        run: |
          mkdir -p build
          docker run --rm \
            -v "$(pwd)":/usr/src/tdesktop \
            -w /usr/src/tdesktop \
            tdesktop:centos_env \
            bash -c "
              cd /usr/src/tdesktop/build && \
              cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DDESKTOP_APP_SPECIAL_TARGET= \
                -DTDESKTOP_API_ID=29579556 \
                -DTDESKTOP_API_HASH=351a588e027c04b1b5a1c2b28cbd9cfd \
                .. && \
              ninja
            "

      - name: Move artifact.
        run: |
          mkdir -p bin
          mv build/bin/Telegram bin/Telegram || mv build/Telegram bin/Telegram

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: bin/Telegram
          if-no-files-found: error
